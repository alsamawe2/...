*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-family:'Reem Kufi',Tahoma,sans-serif;font-size:2rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--btn));border-color:var(--c,var(--btn));color:#fff}
.chip:focus-visible,button:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-inline-start:8px solid var(--c,var(--line));border-radius:14px;padding:22px 20px;margin:14px 0;min-height:230px}
.tag{font-weight:700;color:var(--c,var(--mute))}
.q{font-family:Tajawal,Tahoma,sans-serif;font-weight:700;font-size:1.75rem;line-height:1.7;margin:10px 0}
.a{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:1.4rem;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.main{flex:1;min-width:140px;border:0;border-radius:12px;padding:14px;font:700 1.05rem Tajawal,Tahoma,sans-serif;background:var(--btn);color:var(--btnt);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin:8px 2px}
.clk{font-family:'Reem Kufi',Tahoma,sans-serif;font-size:1.6rem;text-align:center;margin-top:10px;min-height:1.7em;color:var(--c,var(--ink))}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--ink))}
.meta{flex-wrap:wrap;align-items:center;gap:8px}
select{font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:2px 6px}
.award{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.note{min-height:1.6em;margin:8px 2px;font-weight:700}
.players{margin-top:20px}
.players h2{font-family:'Reem Kufi',Tahoma,sans-serif;font-size:1.3rem;margin:0 0 8px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.add button{flex:none;min-width:90px}
#plist{list-style:none;margin:10px 0 0;padding:0}
#plist li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px}
#plist li span{flex:1}
#plist li b{font-family:'Reem Kufi',Tahoma,sans-serif;font-size:1.5rem}
#plist li button{border:0;background:transparent;color:var(--mute);font-size:1.4rem;cursor:pointer;width:32px;height:32px}
.empty{color:var(--mute)}
.about{margin:26px 0 8px;text-align:center;color:var(--mute);font-size:.8rem}
.about summary{cursor:pointer;display:inline-block;padding:4px 10px}
.about p{margin:4px 0 0}
.hide{display:none}
</style>
</head>

}

$("reset").onclick=function(){used={};save();cur=-1;awarded=false;$("award").classList.add("hide");$("note").textContent="";$("tag").textContent="جاهز؟";paint("");$("q").textContent="تمت إعادة كل الأسئلة. اضغط «سؤال جديد».";$("a").classList.add("hide");$("next").textContent="سؤال جديد";counter()};
(function(){
  var names=["الكل"].concat(C),h="";
  names.forEach(function(n,i){h+='<button class="chip" aria-pressed="'+(i===0)+'" data-i="'+(i-1)+'"'+(i>0?' style="--c:'+COL[i-1]+'"':'')+'>'+n+'</button>'});
  $("chips").innerHTML=h;
  $("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;filter=+b.dataset.i;
    [].forEach.call($("chips").children,function(c){c.setAttribute("aria-pressed",c===b)});counter()};
function esc(t){return t.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function renderP(){
    var o=players.map(function(_,i){return i}).sort(function(a,b){return players[b].s-players[a].s});
    var h="",w="";
    o.forEach(function(i){h+='<li><span>'+esc(players[i].n)+'</span><b>'+players[i].s+'</b><button data-r="'+i+'" aria-label="حذف اللاعب">×</button></li>'});
    players.forEach(function(p,i){w+='<button class="chip" data-w="'+i+'">'+esc(p.n)+'</button>'});
    w+='<button class="chip" data-w="x">لا أحد</button>';
    $("plist").innerHTML=h||'<li class="empty">أضف أسماء اللاعبين ليبدأ احتساب النقاط.</li>';
    $("who").innerHTML=w;
    if(cur>=0&&!$("a").classList.contains("hide")&&!awarded&&players.length)$("award").classList.remove("hide");
  }
  function addP(){var n=$("pn").value.trim();if(!n)return;players.push({n:n,s:0});$("pn").value="";renderP()}
  $("addp").onclick=addP;$("pn").onkeydown=function(e){if(e.key==="Enter")addP()};
  $("plist").onclick=function(e){var b=e.target.closest("button");if(!b)return;players.splice(+b.dataset.r,1);renderP()};
  $("who").onclick=function(e){var b=e.target.closest("button");if(!b)return;awarded=true;$("award").classList.add("hide");
    if(b.dataset.w==="x"){$("note").textContent="لم تُمنح نقطة."}else{var p=players[+b.dataset.w];p.s++;$("note").textContent="نقطة لـ "+p.n;renderP()}};
  renderP();
  counter();
})();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
