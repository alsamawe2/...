.meta{flex-wrap:wrap;align-items:center;gap:8px}
select{font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:2px 6px}
.award{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.note{min-height:1.6em;margin:8px 2px;font-weight:700}

.about summary{cursor:pointer;display:inline-block;padding:4px 10px}
.about p{margin:4px 0 0}
.hide{display:none}
</style>

[3, "من الممثل الذي جسّد «فيتو كورليوني» الشاب في «العراب 2»؟", "روبرت دي نيرو"],
[3, "من الممثلة الفرنسية الملقّبة بـ«BB» رمز الستينيات؟", "بريجيت باردو"]
];
var filter=-1,used={},cur=-1,rot=0,KEY="quizUsedV3",RK="quizRotV3";
function hs(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h.toString(36)}
var K=Q.map(function(x){return hs(x[1])});
function load(){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");K.forEach(function(k,i){if(a.indexOf(k)>-1)used[i]=true});rot=+localStorage.getItem(RK)||0}catch(e){}}
function save(){try{var a=[];for(var i=0;i<Q.length;i++)if(used[i])a.push(K[i]);localStorage.setItem(KEY,JSON.stringify(a));localStorage.setItem(RK,rot)}catch(e){}}
var order=Q.map(function(_,i){return i});
function shuf(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=order[i];order[i]=order[j];order[j]=t}}
shuf();load();
var $=function(i){return document.getElementById(i)};
function poolC(c){var p=[];for(var i=0;i<order.length;i++){var q=order[i];if(!used[q]&&Q[q][0]===c)p.push(q)}return p}
function pool(){var p=[];for(var i=0;i<order.length;i++){var q=order[i];if(!used[q]&&(filter<0||Q[q][0]===filter))p.push(q)}return p}
function paint(c){$("card").style.setProperty("--c",c)}
function counter(){$("left").textContent="المتبقي: "+pool().length+" سؤال"}
var players=[],awarded=false,N=C.length;
function pick(){
  if(filter>=0){var p=poolC(filter);return p.length?p[0]:-1}
  for(var t=0;t<N;t++){var p=poolC(Math.floor(rot/2)%N);if(p.length)return p[0];rot=(Math.floor(rot/2)+1)*2}
  return -1;
}
function nextQ(){
  awarded=false;$("award").classList.add("hide");$("note").textContent="";
  var q=pick(),msg="";
  if(q<0){
    for(var i=0;i<Q.length;i++)if(filter<0||Q[i][0]===filter)delete used[i];
    if(filter<0)rot=0;shuf();
    var last=cur;if(last>=0)used[last]=true;q=pick();if(last>=0){delete used[last];if(q<0)q=last}
    msg="اكتملت الدورة كاملة، بدأت دورة جديدة بترتيب جديد."
  }
  cur=q;used[cur]=true;if(filter<0)rot++;save();
  var x=Q[cur];$("tag").textContent=C[x[0]];paint(COL[x[0]]);$("q").textContent=x[1];$("a").textContent=x[2];
  $("a").classList.remove("hide");$("next").textContent="السؤال التالي";counter();if(msg)$("note").textContent=msg;
  if(players.length)$("award").classList.remove("hide");
}
$("next").onclick=nextQ;
$("reset").onclick=function(){used={};rot=0;save();cur=-1;awarded=false;$("award").classList.add("hide");$("note").textContent="";$("tag").textContent="جاهز؟";paint("");$("q").textContent="تمت إعادة كل الأسئلة. اضغط «سؤال جديد».";$("a").classList.add("hide");$("next").textContent="سؤال جديد";counter()};
(function(){
  var names=["الكل"].concat(C),h="";
  names.forEach(function(n,i){h+='<button class="chip" aria-pressed="'+(i===0)+'" data-i="'+(i-1)+'"'+(i>0?' style="--c:'+COL[i-1]+'"':'')+'>'+n+'</button>'});
  $("chips").innerHTML=h;
  $("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;filter=+b.dataset.i;
    [].forEach.call($("chips").children,function(c){c.setAttribute("aria-pressed",c===b)});counter()};
function esc(t){return t.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function renderP(){
    var o=players.map(function(_,i){return i}).sort(function(a,b){return players[b].s-players[a].s});
    var h="",w="";
    o.forEach(function(i){h+='<li><span>'+esc(players[i].n)+'</span><b>'+players[i].s+'</b><button data-r="'+i+'" aria-label="حذف اللاعب">×</button></li>'});
    players.forEach(function(p,i){w+='<button class="chip" data-w="'+i+'">'+esc(p.n)+'</button>'});
    w+='<button class="chip" data-w="x">لا أحد</button>';
    $("plist").innerHTML=h||'<li class="empty">أضف أسماء اللاعبين ليبدأ احتساب النقاط.</li>';
    $("who").innerHTML=w;
    if(cur>=0&&!$("a").classList.contains("hide")&&!awarded&&players.length)$("award").classList.remove("hide");
  }
  function addP(){var n=$("pn").value.trim();if(!n)return;players.push({n:n,s:0});$("pn").value="";renderP()}
  $("addp").onclick=addP;$("pn").onkeydown=function(e){if(e.key==="Enter")addP()};
  $("plist").onclick=function(e){var b=e.target.closest("button");if(!b)return;players.splice(+b.dataset.r,1);renderP()};
  $("who").onclick=function(e){var b=e.target.closest("button");if(!b)return;awarded=true;$("award").classList.add("hide");
    if(b.dataset.w==="x"){$("note").textContent="لم تُمنح نقطة."}else{var p=players[+b.dataset.w];p.s++;$("note").textContent="نقطة لـ "+p.n;renderP()}};
  renderP();
  counter();
})();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
</html>
